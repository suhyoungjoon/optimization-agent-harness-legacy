# 가상 데이터 규모와 분포 (generator 입력). 개선 루프가 바꾸는 대상이 아니다.
# 시각은 모두 "HH:MM", 거리는 km.

region:                          # 관할 구역 경계 (서울 강남3구, 통계청 2013 행정구역경계). 좌표는 km 평면으로 변환해 쓴다
  geojson: geo/gangnam3.geojson
branches:                        # 지점 ID → 표시 이름. 경계는 GeoJSON의 properties.branch로 찾는다
  A: {name: 서초}
  B: {name: 강남}
  C: {name: 송파}
boundary_zone_km: 1              # 다른 지점과 맞닿은 관할 경계에서 이 거리 이내면 area_zone=boundary

days: 10
orders_per_day: 240               # 예약 흉내 기준 미예약(배정 대상)이 10~20%가 되는 부하
workers_per_branch: 10

urgent_share: 0.05               # 긴급 지시서 비율 (레가시 #1)
reservation:                     # 레가시 예약 흉내 (#6 기할당): 지시서가 생긴 순서대로 희망일·희망 시간대·소속 관할 안에서만
  time_window_min: 0             # 예약을 시도한다. 실패한 건이 미예약(배정 대상)으로 남는다. 후보 중 이동시간이 짧은 작업자로 잡는다
  area_extension_km: 0
day: {start: "08:00", end: "18:00"}
worker_availability: ["09:00", "18:00"]   # 기본 근무시간
capacity:                        # 일자별 시간역량 (레가시 #2). 일할 수 있는(Y) 구간의 경계는 unit_min 단위
  unit_min: 30
  recurring_block:               # #8 할당제한반복일정: 며칠마다 같은 시간대를 N으로
    worker_share: 0.1
    period_days: [2, 3]          # 반복 주기(일) 범위
    block_min: [60, 120]         # 막는 길이(분) 범위, unit_min 배수
  hours_reduced:                 # #9 근무시간 축소: 변경일(당일 포함)부터 줄어든 시간만 N. 늘어난 근무시간은 연동하지 않는다
    worker_share: 0.1
    reduce_min: [60, 60]         # 줄어드는 길이(분) 범위. 출근을 늦추거나 퇴근을 당긴다
desired_time:                    # 고객 희망시간: step 간격(약속 시간대와 같은 1시간), 시(hour)별 가중치
  step_min: 60
  hour_weights: {9: 3, 10: 3, 11: 2, 12: 1, 13: 2, 14: 2, 15: 2, 16: 1}

orders:                          # 항목별 비율
  work_type: {install: 0.5, repair: 0.5}
  media: {HFC: 0.3, FTTx: 0.5, CATV: 0.2}
  difficulty: {none: 0.6, pole: 0.15, outdoor: 0.15, high_risk: 0.1}
  building_type: {house: 0.5, apartment: 0.5}

workers:
  skill_prob: {HFC: 0.5, FTTx: 0.7, CATV: 0.4}   # 기술별 보유 확률 (최소 1개 보장)
  cert_share: {pole: 0.5, high_risk: 0.5}        # 자격 보유 비율 (지점별로 고르게 배분). 낮으면 예약이 자격자를 일반 작업으로 먼저 채워 승주·고위험이 막힌다
  cei_range: [50, 100]
  work_types:                    # 개통/AS 역량 (레가시 #5): 대부분 둘 다, 일부만 한쪽 전담. 인원은 round(전체 × 비율)
    install_only: 0.10
    repair_only: 0.05
  std_time:                      # 작업자별 표준작업시간 (레가시 #4): 작업유형 기본 소요 × 계수, step_min 단위
    base_min: {install: 30, repair: 20}
    factor: [0.8, 1.2]
    step_min: 5
  groups_per_branch: 2           # 작업그룹 (레가시 #10): 지점 작업자를 고르게 나눈다
